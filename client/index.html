<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Campus3D - Marketplace EdTech</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00CED1;
            --bg-dark: #020617;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
        }

        /* ================= CANVAS (LAYER TERBAWAH) ================= */
        #renderCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden; /* Muncul setelah enterWorld */
            outline: none;
            z-index: 1;
        }

        /* ================= LANDING PAGE (LAYER TENGAH) ================= */
        /* Z-index rendah agar tidak menutupi popup Firebase */
        #landing-page {
            position: relative;
            z-index: 10; 
            width: 100%;
            min-height: 100vh;
            background: var(--bg-dark);
            overflow-x: hidden;
        }

        /* ================= MARQUEE CSS ================= */
        .marquee-box {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            vertical-align: middle;
            max-width: 0;
            transition: max-width 0.5s ease;
        }
        
        .active-marquee .marquee-box {
            max-width: 300px;
            margin-left: 10px;
        }

        .marquee-content {
            display: inline-block;
            animation: scroll-text 12s linear infinite;
            color: var(--primary);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes scroll-text {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }

        /* ================= MODAL & UI ================= */
        #universal-modal {
            position: fixed;
            inset: 0;
            z-index: 999; /* Di bawah popup Firebase tapi di atas landing */
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        #ui-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            opacity: 0;
            transition: 0.5s;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>

    <div id="landing-page">
        <header class="flex justify-between items-center px-8 py-6 border-b border-white/5">
            <h1 class="text-2xl font-extrabold tracking-tighter">
                CAMPUS<span class="text-[#00CED1]">3D</span>
            </h1>
            <div class="flex items-center gap-6">
                <button id="loginBtn" class="bg-[#00CED1] text-black px-6 py-2 rounded-full font-bold hover:scale-105 transition">
                    LOGIN / DAFTAR
                </button>
            </div>
        </header>

        <section class="py-24 px-6 text-center">
            <h2 class="text-5xl md:text-7xl font-extrabold mb-8">
                Ubah Keahlian Anda<br><span class="text-[#00CED1]">Menjadi Dunia 3D</span>
            </h2>
            <div class="flex flex-col items-center gap-8 mt-12">
                <button id="enter-btn" class="bg-[#00CED1] text-black px-12 py-5 rounded-2xl font-black text-xl shadow-lg hover:shadow-[#00CED1]/20 transition">
                    🚀 MASUK DUNIA 3D
                </button>
                
                <div class="flex gap-6 text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                    <span>W A S D : Jalan</span>
                    <span>Mouse : Kamera</span>
                </div>
            </div>
        </section>

        <footer class="mt-20 py-10 border-t border-white/5 text-center">
            <div class="flex justify-center gap-10 text-sm text-gray-400 mb-6">
                <button onclick="openModal('refund')" class="hover:text-[#00CED1]">Refund</button>
                <button onclick="openModal('terms')" class="hover:text-[#00CED1]">Terms</button>
            </div>
            <p class="text-[10px] text-gray-600">© 2026 Campus3D by Pioneer Portal Team</p>
        </footer>
    </div>

    <div id="live-indicator" class="fixed top-6 left-6 z-[50] flex items-center pointer-events-none">
        <div class="bg-black/60 backdrop-blur-md border border-white/10 px-4 py-2 rounded-full flex items-center">
            <div class="w-2 h-2 bg-[#00CED1] rounded-full animate-ping mr-2"></div>
            <span class="text-[10px] font-bold uppercase tracking-widest">Live</span>
            
            <div class="marquee-box" id="marquee-box">
                <div class="marquee-content">
                    copy dan share link di address bar untuk mengajak teman bergabung sekarang juga
                </div>
            </div>
        </div>
    </div>

    <div id="universal-modal">
        <div class="glass-card p-8 rounded-3xl max-w-sm w-full mx-4 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-xl">&times;</button>
            <div id="modal-content" class="text-sm text-gray-300 leading-relaxed"></div>
        </div>
    </div>

    <div id="ui-overlay">
        <div class="w-10 h-10 border-4 border-[#00CED1]/20 border-t-[#00CED1] rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-bold tracking-[0.2em] text-[#00CED1] uppercase">Memuat Dunia...</p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script type="module" src="/src/main.ts"></script>

    <script>
        // --- LOGIKA MARQUEE (Setiap 10 detik) ---
        const marqueeBox = document.getElementById('marquee-box');
        setInterval(() => {
            marqueeBox.parentElement.parentElement.classList.add('active-marquee');
            setTimeout(() => {
                marqueeBox.parentElement.parentElement.classList.remove('active-marquee');
            }, 8000); // Jalan selama 8 detik
        }, 10000); // Muncul setiap 10 detik

        // --- LOGIKA MODAL ---
        const modal = document.getElementById('universal-modal');
        const modalBody = document.getElementById('modal-content');
        const contents = {
            refund: `<h4 class="text-white font-bold mb-2">Kebijakan Refund</h4><p>Dana aman di Escrow. Refund 100% otomatis jika pengajar tidak hadir dalam 15 menit sesi.</p>`,
            terms: `<h4 class="text-white font-bold mb-2">Syarat Ketentuan</h4><p>Komisi platform 15%. Dilarang menyebarkan konten negatif di ruang virtual.</p>`
        };

        function openModal(key) {
            modalBody.innerHTML = contents[key];
            modal.style.display = 'flex';
        }
        function closeModal() {
            modal.style.display = 'none';
        }

        // --- LOGIKA ENTER WORLD (ASLI) ---
        function enterWorld() {
            const overlay = document.getElementById("ui-overlay");
            overlay.style.opacity = "1";
            overlay.style.pointerEvents = "auto";

            // mic trigger
            navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => { });

            // Sembunyikan landing
            document.getElementById("landing-page").style.display = "none";

            // Munculkan Canvas
            const canvas = document.getElementById("renderCanvas");
            canvas.style.visibility = "visible";

            // Fix Resolusi
            window.dispatchEvent(new Event('resize'));
            
            setTimeout(() => {
                overlay.style.opacity = "0";
                overlay.style.pointerEvents = "none";
            }, 2000);
        }

        document.getElementById("enter-btn").onclick = enterWorld;
    </script>
</body>

</html>
