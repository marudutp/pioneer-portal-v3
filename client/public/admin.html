<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pioneer Admin Dashboard</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 10px; border: 1px solid #444; margin-bottom: 20px;}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #444; }
        th { background: #3d3d3d; color: #00ff00; }
        button { cursor: pointer; padding: 5px 10px; border-radius: 5px; border: none; }
        .btn-kick { background: #ff4d4d; color: white; }
        .btn-broadcast { background: #00ff00; color: #000; font-weight: bold; padding: 10px; width: 100%; margin-top: 10px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; background: #3d3d3d; border: 1px solid #555; color: white; }
        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .online { background: #00ff00; color: #000; }
    </style>
</head>
<body>
    <h1>🚀 Pioneer Admin Dashboard v1.1</h1>
    
    <div id="connection-status" style="margin-bottom: 10px; color: #ff4d4d;">
        🔴 Menghubungkan ke Server Replit...
    </div>

    <div class="card">
        <h3>📢 Broadcast Pengumuman</h3>
        <input type="text" id="broadcastMsg" placeholder="Ketik pesan untuk semua murid...">
        <button class="btn-broadcast" onclick="sendBroadcast()">KIRIM KE SEMUA LAYAR</button>
    </div>

    <div class="card">
        <h3>👥 Siswa Online (<span id="count">0</span>/10)</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>UID</th>
                    <th>Role</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="user-table"></tbody>
        </table>
    </div>

    <script>
        // ⚠️ GANTI ALAMAT INI dengan URL 'WebView' Replit Om yang asli!
        const REPLIT_URL = "https://f75d9c6d-8a1f-441c-84e8-4c3c3764296a-00-2d0b4ng7svqyl.sisko.replit.dev"; 

        // Hubungkan Socket ke Replit
        const socket = io(REPLIT_URL, {
            transports: ['polling', 'websocket'],
            withCredentials: true
        });

        socket.on('connect', () => {
            const status = document.getElementById('connection-status');
            status.innerText = "🟢 Terhubung ke Replit";
            status.style.color = "#00ff00";
            refreshUsers();
        });

        socket.on('connect_error', (err) => {
            const status = document.getElementById('connection-status');
            status.innerText = "🔴 Gagal Konek ke Replit: " + err.message;
            status.style.color = "#ff4d4d";
        });

        function refreshUsers() {
            // Fetch data dari API Replit
            fetch(`${REPLIT_URL}/api/admin/users`)
                .then(res => res.json())
                .then(users => {
                    const table = document.getElementById('user-table');
                    const count = document.getElementById('count');
                    table.innerHTML = '';
                    
                    // Filter yang bukan teacher
                    const students = users.filter(u => u.role !== 'teacher');
                    count.innerText = students.length;

                    users.forEach(user => {
                        const row = `<tr>
                            <td>${user.displayName}</td>
                            <td>${user.uid ? user.uid.substring(0, 8) : '---'}...</td>
                            <td><span class="status-badge ${user.role === 'teacher' ? '' : 'online'}">${user.role}</span></td>
                            <td>
                                <button class="btn-kick" onclick="kickUser('${user.uid}')">KICK</button>
                            </td>
                        </tr>`;
                        table.innerHTML += row;
                    });
                })
                .catch(err => console.error("Gagal ambil data user:", err));
        }

        function kickUser(uid) {
            if(confirm('Yakin mau nendang user ini, Om Marudut?')) {
                socket.emit('admin_kick_user', uid);
                setTimeout(refreshUsers, 1000);
            }
        }

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if(msg) {
                socket.emit('admin_broadcast', msg);
                alert('Pesan dikirim ke seluruh kelas!');
                document.getElementById('broadcastMsg').value = '';
            }
        }

        // Auto-refresh setiap 5 detik
        setInterval(refreshUsers, 5000);
    </script>
</body>
</html>
