<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pioneer Portal V3 - Virtual Classroom</title>

    <!-- Tailwind untuk Landing -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
        }

        /* ================= LANDING OVERLAY ================= */
        #landing-wrapper {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #020617;
            overflow-y: auto;
        }

        /* ================= ORIGINAL STYLE (TIDAK DIUBAH) ================= */

        #renderCanvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .info-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            z-index: 100;
        }

        .capacity-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            z-index: 100;
        }

        .role-badge {
            position: fixed;
            top: 60px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 15px;
            color: white;
            z-index: 100;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: none;
            z-index: 200;
        }

        .control-label {
            position: absolute;
            bottom: 140px;
            left: 20px;
            color: white;
            font-size: 10px;
        }

        .control-label.right {
            left: auto;
            right: 20px;
        }

        #debug-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: black;
            color: #0f0;
            font-size: 9px;
            z-index: 9999;
            display: none;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>

    <!-- ================= LANDING (DARI FILE KEDUA) ================= -->
    <div id="landing-wrapper">

        <header class="flex justify-between items-center px-8 py-5 border-b border-gray-800 text-white">
            <h1 class="text-2xl font-bold text-cyan-400">Campus3D</h1>
        </header>

        <section class="text-center py-24 px-6 text-white">
            <h2 class="text-4xl font-bold">
                Ubah Keahlian Anda Menjadi Dunia 3D
            </h2>

            <p class="mt-6 text-gray-400">
                Platform imersif tanpa install. Masuk langsung dari browser.
            </p>

            <button id="enter-world"
                class="mt-8 bg-cyan-400 text-black px-6 py-3 rounded-lg font-bold">
                🚀 Masuk Dunia 3D
            </button>
        </section>

    </div>

    <!-- ================= ORIGINAL UI ================= -->
    <div id="ui-overlay">
        <div class="loader">
            <p>Memasuki Kelas Virtual...</p>
        </div>
    </div>

    <div class="info-panel">🎓 Pioneer Portal V3</div>
    <div class="capacity-panel">👥 <span id="current-capacity">0</span>/10</div>
    <div class="role-badge" id="role-badge">Loading...</div>

    <div id="mobile-controls"></div>

    <div class="control-label" id="control-label-left" style="display:none;">🎮</div>
    <div class="control-label right" id="control-label-right" style="display:none;">🔄</div>

    <div id="debug-panel"></div>

    <!-- CANVAS -->
    <canvas id="renderCanvas"></canvas>

    <!-- SCRIPT ORIGINAL (TIDAK DIUBAH) -->
    <script type="module" src="/src/main.ts"></script>

    <!-- ================= LANDING CONTROL ================= -->
    <script>
        const landing = document.getElementById("landing-wrapper");
        const enterBtn = document.getElementById("enter-world");

        // sembunyikan canvas & UI dulu
        document.getElementById("renderCanvas").style.display = "none";

        enterBtn.addEventListener("click", async () => {

            // mic trigger (optional tapi bagus)
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) { }

            // tampilkan world
            document.getElementById("renderCanvas").style.display = "block";

            // hilangkan landing
            landing.style.display = "none";
        });
    </script>

</body>
</html>
