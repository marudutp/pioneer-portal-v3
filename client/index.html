<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Campus3D - Virtual Classroom</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
        }

        /* ================= LANDING ================= */
        #landing-page {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #020617, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .landing-content {
            text-align: center;
            color: white;
        }

        .landing-content h1 {
            font-size: 56px;
            color: #00CED1;
            margin-bottom: 10px;
        }

        .landing-content p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .landing-content button {
            background: #00CED1;
            color: black;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .landing-content button:hover {
            transform: scale(1.05);
        }

        /* ================= CANVAS (FIX BLUR) ================= */
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            visibility: hidden; /* ✅ FIX */
        }

        /* ================= LOADER ================= */
        #ui-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
            opacity: 0;
            transition: 0.5s;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .info-panel,
        .capacity-panel,
        .role-badge {
            position: fixed;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            z-index: 100;
        }

        .info-panel { top: 10px; left: 10px; }
        .capacity-panel { top: 10px; right: 10px; }
        .role-badge { top: 50px; left: 10px; }

    </style>
</head>

<body>

    <!-- ================= LANDING ================= -->
    <div id="landing-page">
        <div class="landing-content">
            <h1>Campus3D</h1>
            <p>Masuk ke Dunia Belajar Imersif</p>
            <button id="enter-btn">🚀 Masuk Dunia 3D</button>
        </div>
    </div>

    <!-- ================= LOADER ================= -->
    <div id="ui-overlay">
        <div class="loader">
            <div class="loader-spinner"></div>
            <p>Memasuki Dunia 3D...</p>
        </div>
    </div>

    <!-- ================= UI ================= -->
    <div class="info-panel">🎓 Campus3D</div>
    <div class="capacity-panel">👥 <span id="current-capacity">0</span>/10</div>
    <div class="role-badge" id="role-badge">Loading...</div>

    <!-- ================= CANVAS ================= -->
    <canvas id="renderCanvas"></canvas>

    <!-- ================= SCRIPT ================= -->
    <script>
        const enterBtn = document.getElementById("enter-btn");

        enterBtn.addEventListener("click", async () => {

            console.log("🚀 Entering 3D World...");

            const overlay = document.getElementById("ui-overlay");
            overlay.style.opacity = "1";

            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) { }

            document.getElementById("landing-page").style.display = "none";

            const canvas = document.getElementById("renderCanvas");

            // ✅ FIX BLUR
            canvas.style.visibility = "visible";
            window.dispatchEvent(new Event('resize'));

            const script = document.createElement("script");
            script.type = "module";
            script.src = "/src/main.ts";

            document.body.appendChild(script);

        });
    </script>

</body>
</html>
